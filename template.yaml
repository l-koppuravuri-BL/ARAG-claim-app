AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Health Insurance Claims Tracker Serverless Backend

Parameters:
  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID for JWT verification
  AllowedEmails:
    Type: String
    Description: Comma-separated list of Gmail accounts authorized to log in

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.12

Resources:
  # DynamoDB Table
  ClaimsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: Claims
      PrimaryKey:
        Name: userId
        Type: String
      # SimpleTable only supports partition key. If we need a sort key, we should use AWS::DynamoDB::Table instead!
      # Let's use AWS::DynamoDB::Table to support both partition and sort key, which is critical for query efficiency.

  ClaimsDatabase:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ClaimsTable
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # HTTP API Gateway (v2) - Cheaper and faster
  ClaimsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600

  # Lambda function
  ClaimsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./backend
      Handler: index.handler
      Environment:
        Variables:
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          ALLOWED_EMAILS: !Ref AllowedEmails
          CLAIMS_TABLE_NAME: !Ref ClaimsDatabase
          NODE_ENV: production
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsDatabase
      Events:
        # Route to list or create claims
        ListOrCreateClaims:
          Type: HttpApi
          Properties:
            ApiId: !Ref ClaimsApi
            Path: /claims
            Method: ANY
        # Route for specific claim actions
        ClaimActions:
          Type: HttpApi
          Properties:
            ApiId: !Ref ClaimsApi
            Path: /claims/{id}
            Method: ANY

Outputs:
  ApiUrl:
    Description: "API Gateway Endpoint URL"
    Value: !Sub "https://${ClaimsApi}.execute-api.${AWS::Region}.amazonaws.com"
